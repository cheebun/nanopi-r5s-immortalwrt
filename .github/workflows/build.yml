name: Build R5S firmware

# The build runs on the owner's self-hosted runner by default. Never add
# pull_request / pull_request_target triggers here: a public repository must
# not run untrusted code on a self-hosted machine (see "Self-hosted runner" in
# README.md).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build (github = GitHub-hosted fallback when the self-hosted machine is off)
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github
      immortalwrt_repo:
        description: ImmortalWrt GitHub repository (owner/name); default is our fork
        required: true
        default: cheebun/immortalwrt
        type: string
      immortalwrt_ref:
        # Bump: set this to the new head of the fork's base branch.
        description: ImmortalWrt commit SHA (40 hex) or branch/tag; default = pinned head of the fork's base branch (kernel 6.18)
        required: true
        default: d3a7aaedf7c0763584c9958d5dbee31380bc0d74
        type: string
      use_ccache:
        description: Use and save the ccache cache
        required: true
        default: true
        type: boolean
      upload_packages:
        description: Also upload bin/ packages (kmods for this kernel) as an artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Per host: self-hosted and GitHub-hosted builds share no caches or disk.
  group: build-${{ github.ref }}-${{ inputs.runner == 'github' && 'github' || 'self-hosted' }}
  cancel-in-progress: false

env:
  # owner/name and SHA or branch/tag; validated by scripts/fetch-immortalwrt.sh.
  IMMORTALWRT_REPO: ${{ inputs.immortalwrt_repo }}
  IMMORTALWRT_REF: ${{ inputs.immortalwrt_ref }}
  TARGET_DIR_REL: bin/targets/rockchip/armv8
  DEVICE: friendlyarm_nanopi-r5s
  # github or self-hosted; anything but an explicit "github" builds on the
  # self-hosted runner.
  BUILD_HOST: ${{ inputs.runner == 'github' && 'github' || 'self-hosted' }}
  CCACHE_MAXSIZE: ${{ inputs.runner == 'github' && '3G' || '20G' }}
  # Self-hosted only: persistent dl/ and ccache (subdirectories dl and ccache,
  # created once by the machine's admin, owned by the runner user), and the
  # image the build steps run in.
  SELF_HOSTED_CACHE: ${{ vars.R5S_CACHE_DIR || '/srv/openwrt-cache/r5s' }}
  BUILD_IMAGE: ubuntu:24.04
  TZ: UTC

jobs:
  build:
    # Only the owner's own runs of this repository (not forks, not re-runs by
    # anyone else) may reach the self-hosted runner.
    if: >-
      github.repository == 'cheebun/nanopi-r5s-immortalwrt' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "r5s-builder"]') }}
    # GitHub-hosted jobs are killed at 6 h; stop a little earlier so the
    # always() steps can still save caches and logs.
    timeout-minutes: ${{ inputs.runner == 'github' && 345 || 720 }}
    defaults:
      run:
        # Runs each step with bash on the runner, or inside the build container
        # once "Start build container" has started it (self-hosted).
        shell: bash ${{ github.workspace }}/scripts/ci-shell.sh {0}
    steps:
      # First, so that scripts/ci-shell.sh (the default shell) exists.
      - name: Checkout overlay
        uses: actions/checkout@v7

      - name: Validate inputs
        run: |
          bash scripts/test-fetch-immortalwrt.sh
          bash scripts/test-check-config.sh
          bash scripts/fetch-immortalwrt.sh --dry-run "$IMMORTALWRT_REPO" "$IMMORTALWRT_REF" immortalwrt
          if [[ "$IMMORTALWRT_REPO" != cheebun/immortalwrt ]]; then
            echo "::warning::building from $IMMORTALWRT_REPO; r5s.config and the feed patches target the base branch of cheebun/immortalwrt"
          fi
          # Artifact names must not contain "/" (branch names may).
          echo "IMMORTALWRT_REF_LABEL=${IMMORTALWRT_REF//\//-}" >> "$GITHUB_ENV"

      - name: Free disk space
        if: env.BUILD_HOST == 'github'
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / /mnt 2>/dev/null || df -h /

      - name: Pick build volume
        if: env.BUILD_HOST == 'github'
        run: |
          # Some runners have a larger scratch disk on /mnt. Build on whichever
          # filesystem has more free space; a BTF build needs ~45 GB.
          root_free=$(df --output=avail -B1G / | tail -1 | tr -d ' ')
          mnt_free=0
          if mountpoint -q /mnt; then
            mnt_free=$(df --output=avail -B1G /mnt | tail -1 | tr -d ' ')
          fi
          if (( mnt_free > root_free )); then
            sudo mkdir -p /mnt/work
            sudo chown "$(id -u):$(id -g)" /mnt/work
            build_root=/mnt/work
          else
            build_root="$RUNNER_TEMP/work"
            mkdir -p "$build_root"
          fi
          echo "Free: / ${root_free}G, /mnt ${mnt_free}G -> $build_root"
          if (( (mnt_free > root_free ? mnt_free : root_free) < 40 )); then
            echo "::warning::less than 40 GB free; the build may run out of disk"
          fi
          {
            echo "BUILD_ROOT=$build_root"
            echo "TREE=$build_root/immortalwrt"
            echo "DL_DIR_PATH=$build_root/immortalwrt/dl"
            echo "CCACHE_DIR_PATH=$build_root/ccache"
          } >> "$GITHUB_ENV"

      - name: Prepare self-hosted workspace
        if: env.BUILD_HOST == 'self-hosted'
        run: |
          docker info --format 'Docker {{.ServerVersion}}, storage {{.Driver}}'
          # Persistent caches, created once by the machine's admin:
          #   sudo install -d -o <runner-user> -g <runner-user> "$SELF_HOSTED_CACHE"/{dl,ccache}
          for d in "$SELF_HOSTED_CACHE/dl" "$SELF_HOSTED_CACHE/ccache"; do
            if [[ ! -d "$d" || ! -w "$d" ]]; then
              echo "::error::$d is missing or not writable by $(id -un); create it owned by the runner user"
              exit 1
            fi
          done
          # A BTF build needs ~45 GB in the tree, plus dl/ and ccache.
          need=60
          for d in "$RUNNER_TEMP" "$SELF_HOSTED_CACHE"; do
            free=$(df --output=avail -B1G "$d" | tail -1 | tr -d ' ')
            echo "$d: ${free} GB free"
            if (( free < need )); then
              echo "::error::only ${free} GB free on the filesystem of $d; the build needs at least ${need} GB"
              exit 1
            fi
          done
          # Fresh tree every run; ccache and dl/ are the only things kept.
          build_root="$RUNNER_TEMP/work"
          rm -rf -- "$build_root"
          mkdir -p "$build_root"
          {
            echo "BUILD_ROOT=$build_root"
            echo "TREE=$build_root/immortalwrt"
            echo "DL_DIR_PATH=$SELF_HOSTED_CACHE/dl"
            echo "CCACHE_DIR_PATH=$SELF_HOSTED_CACHE/ccache"
          } >> "$GITHUB_ENV"

      - name: Start build container
        if: env.BUILD_HOST == 'self-hosted'
        run: |
          # The build steps run as the runner's uid in a throwaway container
          # (scripts/ci-shell.sh). Only the runner's work directory and the
          # caches are mounted, at their host paths; no Docker socket.
          work_root=$(dirname "$RUNNER_TEMP")
          case "$GITHUB_WORKSPACE" in
            "$work_root"/*) ;;
            *) echo "::error::$GITHUB_WORKSPACE is not under $work_root"; exit 1 ;;
          esac
          name="r5s-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Containers left behind by a killed job of this workflow.
          docker ps -aq --filter label=r5s-build | xargs -r docker rm -f
          docker pull "$BUILD_IMAGE"
          docker run -d --name "$name" --label r5s-build --init \
            --user "$(id -u):$(id -g)" --security-opt no-new-privileges \
            -e HOME=/home/builder -e LANG=C.UTF-8 \
            -v "$work_root:$work_root" -v "$SELF_HOSTED_CACHE:$SELF_HOSTED_CACHE" \
            "$BUILD_IMAGE" sleep infinity
          docker exec -u 0 "$name" install -d -o "$(id -u)" -g "$(id -g)" /home/builder
          echo "BUILD_CONTAINER=$name" >> "$GITHUB_ENV"

      - name: Install build dependencies
        env:
          CI_SHELL_ROOT: 1
        run: |
          # GitHub-hosted: on the runner with sudo. Self-hosted: as root in the
          # build container, which also needs what GitHub's image preinstalls.
          sudo=(sudo)
          extra=()
          if [[ "$(id -u)" -eq 0 ]]; then
            sudo=()
            extra=(ca-certificates bc bzip2 xz-utils patch perl time procps kmod autoconf
              automake autopoint libtool gperf help2man texinfo intltool ninja-build
              device-tree-compiler python3-pip python3-ply python3-docutils python3-venv re2c
              lld squashfs-tools libglib2.0-dev libreadline-dev libgmp-dev libmpc-dev
              libmpfr-dev libyaml-dev jq)
          fi
          "${sudo[@]}" apt-get update
          "${sudo[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev python3 python3-dev python3-setuptools \
            python3-pyelftools swig rsync unzip zstd file wget curl xxd cpio pkgconf ccache \
            dwarves "${extra[@]}"
          # pahole for BTF. The build also compiles its own host dwarves
          # (CONFIG_DWARVES, selected by KERNEL_DEBUG_INFO_BTF); this one is
          # for ad-hoc checks and as a fallback on PATH.
          pahole --version

      - name: Checkout ImmortalWrt
        run: |
          # Validates again, fetches exactly one commit (retried), asserts a SHA
          # ref, and exports IMMORTALWRT_SHA.
          bash scripts/fetch-immortalwrt.sh "$IMMORTALWRT_REPO" "$IMMORTALWRT_REF" "$TREE"
          sha=$(git -C "$TREE" rev-parse HEAD)
          kernel=$(sed -n 's/^KERNEL_PATCHVER:=//p' "$TREE/target/linux/rockchip/Makefile")
          [ -n "$kernel" ] || { echo "::error::no KERNEL_PATCHVER in target/linux/rockchip/Makefile"; exit 1; }
          sub=$(sed -n "s/^LINUX_VERSION-${kernel//./\\.} = *//p" "$TREE/target/linux/generic/kernel-$kernel" 2>/dev/null || true)
          echo "Kernel for rockchip: $kernel${sub:+ ($kernel$sub)}"
          echo "KERNEL_PATCHVER=$kernel" >> "$GITHUB_ENV"
          {
            echo "### ImmortalWrt source"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Repository | \`$IMMORTALWRT_REPO\` |"
            echo "| Ref | \`$IMMORTALWRT_REF\` |"
            echo "| Commit | \`$sha\` |"
            echo "| Kernel | \`$kernel$sub\` (KERNEL_PATCHVER $kernel) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # master does not pin its feeds; prepare-feeds.sh records the commits.
          cat "$TREE/feeds.conf.default"

      - name: Install overlay
        run: bash scripts/install-overlay.sh "$TREE"

      # GitHub-hosted only; the self-hosted runner keeps dl/ and ccache in
      # $SELF_HOSTED_CACHE instead.
      - name: Restore dl cache
        id: dl-cache
        if: env.BUILD_HOST == 'github'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TREE }}/dl
          # v2: older dl- caches contain a go-mod-cache damaged by the old
          # cleanup (small Go sources deleted); never restore them.
          key: dl-v2-${{ inputs.immortalwrt_ref }}-${{ hashFiles('r5s.config') }}
          restore-keys: |
            dl-v2-${{ inputs.immortalwrt_ref }}-
            dl-v2-

      - name: Restore ccache
        if: env.BUILD_HOST == 'github' && inputs.use_ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR_PATH }}
          key: ccache-${{ inputs.immortalwrt_ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.immortalwrt_ref }}-
            ccache-

      - name: Update and install feeds
        run: |
          # Also resolves the mosdns conflict, checks the vantage feed and
          # writes the feed lock (see the script).
          mkdir -p out
          bash scripts/prepare-feeds.sh "$TREE" --lock out/feeds.lock.txt

      - name: Apply feed patches
        working-directory: ${{ env.TREE }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/test-apply-feed-patches.sh"
          FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        working-directory: ${{ env.TREE }}
        env:
          USE_CCACHE: ${{ inputs.use_ccache }}
        run: |
          # CI-only options; device and package choices live in r5s.config.
          {
            echo 'CONFIG_DEVEL=y'
            echo 'CONFIG_BUILD_LOG=y'
            # <tree>/dl on GitHub-hosted, the persistent cache on self-hosted.
            echo "CONFIG_DOWNLOAD_FOLDER=\"$DL_DIR_PATH\""
            if [ "$USE_CCACHE" = "true" ]; then
              echo 'CONFIG_CCACHE=y'
              echo "CONFIG_CCACHE_DIR=\"$CCACHE_DIR_PATH\""
            else
              echo '# CONFIG_CCACHE is not set'
            fi
          } > "$RUNNER_TEMP/ci.config"
          # CONFIG_FEED_<name>=m for every feed the download server does not
          # host: base-files then writes its distfeeds.list line commented out.
          bash "$GITHUB_WORKSPACE/scripts/distfeeds-config.sh" . > "$RUNNER_TEMP/distfeeds.config"
          cat "$RUNNER_TEMP/distfeeds.config"
          bash "$GITHUB_WORKSPACE/scripts/compose-config.sh" .config \
            "$GITHUB_WORKSPACE/r5s.config" "$RUNNER_TEMP/ci.config" "$RUNNER_TEMP/distfeeds.config"
          make defconfig
          missing=0
          while IFS= read -r line; do
            grep -qxF -- "$line" .config || { echo "::error::$line did not survive make defconfig"; missing=1; }
          done < "$RUNNER_TEMP/distfeeds.config"
          [ "$missing" -eq 0 ]
          # Fails on missing BTF/netkit/devcrypto/chrony/mosdns/kmods or honk
          # runtime deps, on busybox ntpd, on any removed package, Argon or
          # honk package (=y or =m), on packages installed from the wrong feed,
          # and on a daeuniverse feed.
          bash "$GITHUB_WORKSPACE/scripts/check-config.sh" --config .config --tree .
          ./scripts/diffconfig.sh > "$RUNNER_TEMP/diffconfig"
          cat "$RUNNER_TEMP/diffconfig"

      - name: Download sources
        working-directory: ${{ env.TREE }}
        run: |
          make download -j8 || make download -j1 V=s
          # Truncated downloads are a classic cause of late build failures.
          # Top level only: dl/go-mod-cache holds small Go sources that must stay.
          bash "$GITHUB_WORKSPACE/scripts/test-dl-cleanup.sh"
          bash "$GITHUB_WORKSPACE/scripts/clean-dl.sh" "$DL_DIR_PATH"
          du -sh "$DL_DIR_PATH"

      - name: Build firmware
        id: build
        working-directory: ${{ env.TREE }}
        run: |
          echo "Building with $(nproc) jobs"
          set -o pipefail
          make -j"$(nproc)" world 2>&1 | tee build.log

      - name: Verbose retry of the failed package
        if: failure()
        working-directory: ${{ env.TREE }}
        run: |
          [ -f build.log ] || exit 0
          # subdir.mk prints e.g. "ERROR: package/feeds/luci/luci-app-chrony failed to build."
          failed=$(sed -n 's/.*ERROR: \([^ ]*\) failed to build.*/\1/p' build.log | head -1 || true)
          if [ -n "$failed" ]; then
            echo "=== Rebuilding $failed with V=s ==="
            make "$failed/compile" V=s -j1 2>&1 | tee build-verbose.log || true
            grep -nE "error:|Error [0-9]|FAILED|Patch failed|No rule to make target" build-verbose.log | head -40 || true
          else
            echo "No failing package found in build.log"
            tail -150 build.log
          fi

      - name: Verify build outputs
        working-directory: ${{ env.TREE }}
        run: |
          kernel_config=$(find build_dir/target-*/linux-rockchip_armv8 -maxdepth 2 -path '*/linux-[0-9]*/.config' -print -quit 2>/dev/null || true)
          rootfs=$(find build_dir -mindepth 2 -maxdepth 2 -type d -name 'root-rockchip*' -print -quit)
          test -n "$kernel_config" || { echo "::error::kernel .config not found"; exit 1; }
          test -n "$rootfs" || { echo "::error::staged rootfs not found"; exit 1; }
          manifest_args=()
          while IFS= read -r -d '' m; do manifest_args+=(--manifest "$m"); done \
            < <(find "$TARGET_DIR_REL" -maxdepth 1 -name '*.manifest' -print0)
          (( ${#manifest_args[@]} )) || { echo "::error::no image manifest found"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/check-config.sh" --config .config --tree . \
            --kernel-config "$kernel_config" --rootfs "$rootfs" "${manifest_args[@]}"
          # The kernel must actually carry a .BTF section, not just the option.
          vmlinux="$(dirname "$kernel_config")/vmlinux"
          readelf -S --wide "$vmlinux" | grep -q '\.BTF' \
            || { echo "::error::no .BTF section in $vmlinux"; exit 1; }
          # Every enabled apk repository of the image must exist on the
          # download server (404 fails, timeouts only warn).
          bash "$GITHUB_WORKSPACE/scripts/check-distfeeds.sh" "$rootfs"
          ls "$TARGET_DIR_REL"/*"$DEVICE"*sysupgrade.img.gz

      - name: Collect artifacts
        if: always()
        env:
          # Only copies files; also works if the build container is gone.
          CI_SHELL_HOST: 1
        run: |
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          t="$TREE/$TARGET_DIR_REL"
          shopt -s nullglob
          for f in "$t"/*"$DEVICE"*sysupgrade.img.gz "$t"/*.manifest "$t"/config.buildinfo \
                   "$t"/feeds.buildinfo "$t"/version.buildinfo "$t"/sha256sums "$t"/profiles.json \
                   "$TREE"/build.log "$RUNNER_TEMP"/diffconfig; do
            cp -- "$f" "$out/"
          done
          # Only written when the verbose retry found a failed package.
          if [ -f "$TREE/build-verbose.log" ]; then
            cp -- "$TREE/build-verbose.log" "$out/"
          fi
          {
            echo "overlay_commit=$GITHUB_SHA"
            echo "immortalwrt_repo=$IMMORTALWRT_REPO"
            echo "immortalwrt_ref=$IMMORTALWRT_REF"
            echo "immortalwrt_commit=${IMMORTALWRT_SHA:-unknown}"
            echo "kernel_patchver=${KERNEL_PATCHVER:-unknown}"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            # Exact feed commits (master feeds are unpinned); the same lines
            # are in feeds.lock.txt, usable as feeds.conf.
            if [ -f "$out/feeds.lock.txt" ]; then
              echo "feeds:"
              sed 's/^/  /' "$out/feeds.lock.txt"
            fi
          } > "$out/build-info.txt"
          if [ -d "$TREE/logs" ] && [ ! -f "$t/sha256sums" ]; then
            tar -C "$TREE" -czf "$out/logs.tar.gz" logs
          fi
          ls -la "$out"
          df -h "$BUILD_ROOT"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r5s-firmware-${{ env.IMMORTALWRT_REF_LABEL }}-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload packages
        if: success() && inputs.upload_packages
        uses: actions/upload-artifact@v7
        with:
          name: r5s-packages-${{ env.IMMORTALWRT_REF_LABEL }}-${{ github.run_number }}
          path: |
            ${{ env.TREE }}/bin/targets/rockchip/armv8/packages/
            ${{ env.TREE }}/bin/packages/
          retention-days: 7

      - name: Save dl cache
        # Only after a successful firmware build, so a damaged dl/ is never cached.
        if: always() && env.BUILD_HOST == 'github' && steps.build.outcome == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TREE }}/dl
          key: dl-v2-${{ inputs.immortalwrt_ref }}-${{ hashFiles('r5s.config') }}

      - name: Save ccache
        if: always() && env.BUILD_HOST == 'github' && inputs.use_ccache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR_PATH }}
          key: ccache-${{ inputs.immortalwrt_ref }}-${{ github.run_id }}

      - name: Clean up self-hosted workspace
        if: always() && env.BUILD_HOST == 'self-hosted'
        env:
          CI_SHELL_HOST: 1
        run: |
          # Stops the build (also after a cancel) and frees the ~45 GB tree;
          # $SELF_HOSTED_CACHE is kept.
          if [[ -n "${BUILD_CONTAINER:-}" ]]; then
            docker rm -f "$BUILD_CONTAINER"
          fi
          rm -rf -- "${BUILD_ROOT:-$RUNNER_TEMP/work}" "$GITHUB_WORKSPACE/out"
          df -h "$RUNNER_TEMP" "$SELF_HOSTED_CACHE"
          du -sh "$SELF_HOSTED_CACHE"/* 2>/dev/null || true
